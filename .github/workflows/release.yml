name: Build & Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify built files exist
        run: |
          test -f main.js
          test -f styles.css
          test -f manifest.json

      - name: Lint manifest & versions consistency (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          if [ "$TAG" != "$MANIFEST_VERSION" ]; then
            echo "::error::Tag $TAG does not match manifest.json version $MANIFEST_VERSION"
            exit 1
          fi
          MIN_APP=$(node -p "require('./manifest.json').minAppVersion")
          VERSIONS=$(node -p "require('./versions.json')['$MANIFEST_VERSION'] || ''")
          if [ -n "$VERSIONS" ] && [ "$VERSIONS" != "$MIN_APP" ]; then
            echo "::error::versions.json entry for $MANIFEST_VERSION ($VERSIONS) does not match minAppVersion ($MIN_APP)"
            exit 1
          fi
          echo "Version checks passed for $TAG"

      - name: Upload build artifacts (every run)
        uses: actions/upload-artifact@v4
        with:
          name: any-viewer-build
          path: |
            main.js
            manifest.json
            styles.css

      - name: Generate build provenance attestations (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Extract release notes from CHANGELOG.md (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          node -e '
            const fs = require("fs");
            const tag = process.argv[1];
            const md = fs.readFileSync("CHANGELOG.md", "utf8");
            const re = new RegExp("(?:^|\\n)## " + tag + "(?:[ \\t].*)?\\n([\\s\\S]*?)(?=\\n## |$)");
            const m = re.exec(md);
            if (!m) {
              console.error("::error::CHANGELOG.md has no section for version " + tag + " — add one before tagging");
              process.exit(1);
            }
            fs.writeFileSync(process.env.RUNNER_TEMP + "/release-notes.md", m[1].trim() + "\n");
            console.log("[release-notes] extracted " + m[1].trim().length + " chars for " + tag);
          ' "$TAG"

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            main.js
            manifest.json
            styles.css
          body_path: ${{ runner.temp }}/release-notes.md
          generate_release_notes: true
